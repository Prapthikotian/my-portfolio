<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prapthi | MCA Student & Software Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#08090D;--bg2:#10131C;--tx:#fff;--mu:#A5AAB7;--b:#748BFF;--v:#8D75FF;color-scheme:dark}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:radial-gradient(900px 500px at 85% -5%,#8D75FF22,transparent),var(--bg);color:var(--tx);font:400 16px/1.65 Sora,Inter,system-ui,sans-serif}
a{color:inherit}:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.nav{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(18px,5vw,64px);background:#08090Dcc;backdrop-filter:blur(14px)}
.logo{font-weight:700;text-decoration:none;letter-spacing:.04em}.nav nav{display:flex;gap:22px}
.nav nav a{text-decoration:none;color:var(--mu);font-size:14px;padding:4px 0;border-bottom:2px solid transparent;transition:.2s}.nav nav a.on,.nav nav a:hover{color:#fff;border-color:var(--b)}
.burger{display:none;background:none;border:0;color:#fff}
.hero{min-height:100svh;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:32px;padding:110px clamp(18px,5vw,64px) 60px;max-width:1280px;margin:auto}
.small{color:var(--b);letter-spacing:.2em;font-size:13px}h1{font-size:clamp(52px,9vw,120px);line-height:1;font-weight:700;letter-spacing:-.03em}
.tag{font-size:clamp(20px,2.4vw,30px);font-weight:300;margin:12px 0 18px}.lead{color:var(--mu);max-width:56ch;margin-bottom:14px}.muted{color:var(--mu)}
.chip{display:inline-block;font-size:12px;letter-spacing:.12em;color:#c9d1ff;border:1px solid #748BFF55;border-radius:99px;padding:4px 14px;margin:6px 0 22px}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;gap:8px;align-items:center;padding:12px 24px;border-radius:99px;border:1px solid #ffffff30;background:#ffffff0d;color:#fff;text-decoration:none;font:600 14px Sora,sans-serif;cursor:pointer;transition:.25s}
.btn:hover{border-color:var(--b);transform:translateY(-2px)}.btn.pri{background:linear-gradient(120deg,var(--b),var(--v));border:0}.btn:disabled{opacity:.6}
.hero-r{position:relative;display:grid;place-items:center;min-height:440px}
.orb{position:absolute;width:112%;aspect-ratio:1;left:-22%;bottom:-18%;pointer-events:none}.orb canvas{width:100%!important;height:100%!important}
.portrait{position:relative;width:min(340px,70vw);aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;border-radius:50% 50% 44% 44%/ 38% 38% 30% 30%;border:1px solid #ffffff40;box-shadow:0 0 0 8px #ffffff08,0 0 70px #748BFF55,0 0 120px #8D75FF33}
.portrait.sm{width:min(300px,100%)}
.sec{max-width:1120px;margin:auto;padding:96px clamp(18px,5vw,64px) 24px}.h2{font-size:clamp(28px,4vw,44px);letter-spacing:-.01em;margin-bottom:36px}
.split{display:grid;grid-template-columns:1fr 1.3fr;gap:44px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:20px}.grid.two{grid-template-columns:1fr 1fr}
.card{height:100%;padding:26px;border-radius:22px;border:1px solid #ffffff1a;background:linear-gradient(160deg,#ffffff12,#ffffff05);backdrop-filter:blur(12px);transition:transform .25s,border-color .25s}
.card:hover{border-color:#748BFF77}.card h3{margin-bottom:10px;font-size:18px}.card ul{margin:12px 0 14px 18px;color:var(--mu);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tagb{font-size:13px;padding:5px 12px;border-radius:99px;background:var(--bg2);border:1px solid #ffffff18;color:#dfe3ff}
.shot{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin-bottom:16px}.ph{display:grid;place-items:center;text-align:center;padding:16px;font-weight:600;color:#c9d1ff;background:radial-gradient(circle at 30% 20%,#748BFF44,transparent 60%),radial-gradient(circle at 80% 90%,#8D75FF44,transparent 55%),var(--bg2);border:1px solid #ffffff14}
.tl{list-style:none;border-left:2px solid #748BFF66;padding-left:28px;display:grid;gap:34px}.tl li{position:relative}.tl li::before{content:"";position:absolute;left:-37px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--b);box-shadow:0 0 18px var(--b)}
.links{list-style:none;display:grid;gap:12px;margin-top:20px}.links li{display:flex;gap:12px;align-items:center;color:var(--mu)}.links svg{color:var(--b);flex:none}.links a{color:#fff}
.form{display:grid;gap:14px}label{display:grid;gap:6px;font-size:13px;color:var(--mu)}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #ffffff25;background:#00000040;color:#fff;font:inherit}input[aria-invalid=true],textarea[aria-invalid=true]{border-color:#ff7a8a}
.err{color:#ff9aa6;font-size:12px;min-height:0}.note{font-size:13px;color:var(--mu)}.note a{color:#9fb0ff}
footer{text-align:center;color:var(--mu);font-size:13px;padding:60px 0 30px}
@media(max-width:820px){.hero,.split,.grid.two{grid-template-columns:1fr}.hero-r{min-height:380px;order:-1;margin-top:20px}.orb{width:100%;left:0;bottom:-12%}
 .burger{display:block}.nav nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:#08090Dee;padding:16px 24px;gap:14px}.nav nav.open{display:flex}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.tilt{transform:none!important}}
.glow{position:fixed;left:0;top:0;width:400px;height:400px;border-radius:50%;background:radial-gradient(#748BFF2e,transparent 65%);pointer-events:none;z-index:1;transition:transform .18s ease-out}
.bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;background:linear-gradient(90deg,var(--b),var(--v));transform-origin:0 50%;transform:scaleX(0)}
.nav,main,footer{position:relative;z-index:2}.nav{position:fixed}
.card{position:relative;overflow:hidden}.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--x,50%) var(--y,50%),#748BFF33,transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}.card:hover::before{opacity:1}
.tagb{transition:.2s}.tagb:hover{transform:translateY(-3px);border-color:var(--b);box-shadow:0 6px 18px #748BFF33}
.mag{transition:transform .2s ease-out,border-color .25s}
h1 span{display:inline-block;animation:drop .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*70ms);text-shadow:0 0 40px #748BFF66}
@keyframes drop{from{opacity:0;transform:translateY(60px) rotate(8deg)}}
.tag{background:linear-gradient(90deg,#fff,#9fb0ff,#b9a6ff,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.type{color:#c9d1ff;font-size:15px;min-height:26px;margin-bottom:10px}.type::after{content:"";display:inline-block;width:2px;height:1em;background:var(--b);margin-left:3px;vertical-align:-2px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.fl{position:absolute;z-index:3;padding:8px 14px;border-radius:14px;font-size:12px;background:#ffffff14;border:1px solid #ffffff2a;backdrop-filter:blur(10px);animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-14px)}}
.mq{overflow:hidden;border-block:1px solid #ffffff14;padding:16px 0;margin-top:20px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq div{display:flex;gap:44px;width:max-content;animation:mq 30s linear infinite}.mq:hover div{animation-play-state:paused}.mq span{color:var(--mu);font-size:20px;white-space:nowrap}@keyframes mq{to{transform:translateX(-50%)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stats b{display:block;font-size:46px;line-height:1.1;background:linear-gradient(120deg,var(--b),var(--v));-webkit-background-clip:text;background-clip:text;color:transparent}.stats span{color:var(--mu);font-size:14px}
.rv:not(.in){opacity:0}.rv.in{animation:up .7s backwards}@keyframes up{from{opacity:0;transform:translateY(28px)}}
@media(hover:none){.glow{display:none}}
</style></head>

(function(){const cv=$('#gl'),calm=matchMedia('(prefers-reduced-motion: reduce)').matches,low=innerWidth<768;
